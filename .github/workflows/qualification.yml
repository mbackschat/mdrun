name: Source qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check locked crate notices
        run: python3 packaging/notices.py check
      - name: Check dependency quarantine before compilation
        run: python3 scripts/dependency_policy.py
      - name: Install Rust checks
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy && rustup default 1.98.1
      - name: Verify audited toolchain attribution
        run: python3 packaging/toolchain.py generate
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Qualify shared native custody coordination
        timeout-minutes: 1
        run: |
          MDRUN_NATIVE_TEST_BIN="$PWD/target/debug/mdrun" cargo test --locked --bin mdrun session::broker::tests:: -- --include-ignored
      - name: Render generated manuals
        if: runner.os == 'macOS'
        run: |
          MDRUN_MANDOC=/usr/bin/mandoc cargo test --locked --bin mdrun manual::render_with_mandoc -- --ignored
      - name: Check terminal fixture observation guards
        run: python3 -m unittest discover -s tests/runtime/session -p 'test_*.py'
      - name: Qualify controlling-terminal sessions
        timeout-minutes: 1
        run: python3 tests/runtime/session/terminal.py --mdrun "$PWD/target/debug/mdrun" --results "$RUNNER_TEMP/terminal"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terminal-${{ matrix.os }}
          path: ${{ runner.temp }}/terminal
          retention-days: 7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
      - name: Qualify the cooperative Node SDK
        timeout-minutes: 1
        run: node --test --test-timeout=10000 tests/runtime/node/worker.test.mjs
      - name: Qualify native sessions with Node
        timeout-minutes: 1
        run: |
          MDRUN_NODE="$(command -v node)" cargo test --locked --test integration session:: -- --ignored --skip session::jvm_ --skip session::python:: --skip session::batch::
      - name: Qualify multi-document warm batch isolation
        timeout-minutes: 1
        run: |
          MDRUN_NODE="$(command -v node)" cargo test --locked --test integration session::batch:: -- --include-ignored
      - name: Qualify the cooperative Python SDK
        timeout-minutes: 1
        run: |
          python3 --version
          PYTHONDONTWRITEBYTECODE=1 python3 tests/runtime/python/qualify.py
      - name: Qualify native sessions with Python
        timeout-minutes: 1
        run: |
          MDRUN_PYTHON="$(command -v python3)" cargo test --locked --test integration session::python:: -- --ignored
      - name: Qualify custody after warm host, worker and author loss
        timeout-minutes: 1
        run: |
          MDRUN_NODE="$(command -v node)" cargo test --locked --test integration warm_owner_loss:: -- --ignored --test-threads=1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore verified JVM dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mdrun/jvm
          key: jvm-dependency-${{ runner.os }}-${{ hashFiles('sdk/jvm/dependencies.lock.json') }}
      - name: Prepare hash-locked JVM SDK and independent cold fixture
        timeout-minutes: 4
        run: python3 tests/runtime/jvm/prepare.py --java-home "$JAVA_HOME" --download --cache-dir "$HOME/.cache/mdrun/jvm" --output "$RUNNER_TEMP/jvm-fixture"
      - name: Qualify the cooperative JVM SDK
        timeout-minutes: 1
        env:
          MDRUN_JVM_FIXTURE: ${{ runner.temp }}/jvm-fixture/fixture-manifest.json
        run: python3 tests/runtime/jvm/qualify.py
      - name: Qualify application character output against cold Java
        timeout-minutes: 1
        env:
          MDRUN_JVM_FIXTURE: ${{ runner.temp }}/jvm-fixture/fixture-manifest.json
        run: python3 tests/runtime/jvm/output_bridge.py
      - name: Qualify native sessions with the JVM
        timeout-minutes: 1
        env:
          MDRUN_JVM_FIXTURE: ${{ runner.temp }}/jvm-fixture/fixture-manifest.json
        run: cargo test --locked --test integration session::jvm_ -- --ignored
      - run: cargo build --release --locked
      - name: Run the README warm and batch demos
        timeout-minutes: 1
        run: python3 examples/warm-python/run.py --mdrun "$PWD/target/release/mdrun" --output "$RUNNER_TEMP/readme-warm-demo"
      - name: Qualify bounded Node streaming with stalled readers
        timeout-minutes: 1
        run: |
          python3 tests/runtime/session/streaming.py --mdrun "$PWD/target/release/mdrun" --node "$(command -v node)" --output "$RUNNER_TEMP/node-streaming.json"
      - name: Qualify bounded JVM streaming with stalled readers
        timeout-minutes: 1
        run: |
          python3 tests/runtime/session/streaming.py --mdrun "$PWD/target/release/mdrun" --jvm-fixture "$RUNNER_TEMP/jvm-fixture/fixture-manifest.json" --output "$RUNNER_TEMP/jvm-streaming.json"
      - name: Qualify bounded Python streaming with stalled readers
        timeout-minutes: 1
        run: |
          python3 tests/runtime/session/streaming.py --mdrun "$PWD/target/release/mdrun" --python "$(command -v python3)" --output "$RUNNER_TEMP/python-streaming.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: streaming-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/node-streaming.json
            ${{ runner.temp }}/jvm-streaming.json
            ${{ runner.temp }}/python-streaming.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: mdrun-${{ matrix.os }}
          path: target/release/mdrun
          retention-days: 7
      - run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/compatibility -p 'test_*.py'
      - run: MDRUN_JAVA_HOME="$JAVA_HOME" python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      - name: Check contributor entry point
        run: test -L AGENTS.md && test "$(readlink AGENTS.md)" = CLAUDE.md

  compatibility-oracle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Fetch pinned upstream oracle
        run: git clone --branch v0.6.1 --depth 1 https://github.com/simonw/showboat.git "$RUNNER_TEMP/showboat-source"
      - name: Build and identify oracle
        run: python3 tests/compatibility/prepare.py --source "$RUNNER_TEMP/showboat-source" --output "$RUNNER_TEMP/showboat-oracle"
      - name: Check differential fixture determinism
        run: python3 tests/compatibility/oracle.py --oracle "$RUNNER_TEMP/showboat-oracle/showboat" --candidate "$RUNNER_TEMP/showboat-oracle/showboat" --suite upstream --results "$RUNNER_TEMP/oracle-selfcheck"
      - uses: actions/download-artifact@v8
        with:
          name: mdrun-${{ matrix.os }}
          path: ${{ runner.temp }}/candidate
      - name: Qualify document behavior
        run: |
          chmod +x "$RUNNER_TEMP/candidate/mdrun"
          python3 tests/compatibility/oracle.py --oracle "$RUNNER_TEMP/showboat-oracle/showboat" --candidate "$RUNNER_TEMP/candidate/mdrun" --results "$RUNNER_TEMP/product-differential"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/oracle-selfcheck
            ${{ runner.temp }}/product-differential
          retention-days: 7
