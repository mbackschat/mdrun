name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check locked crate notices
        run: python3 packaging/notices.py check
      - name: Check dependency quarantine before compilation
        run: python3 scripts/dependency_policy.py
      - name: Require the release tag to match the crate
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(python3 packaging/distribution.py version)"
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target ${{ matrix.target }} && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package native archive
        run: python3 packaging/distribution.py archive "${{ matrix.target }}" dist
      - name: Verify archived standalone executable
        run: |
          mkdir target/package-smoke
          tar -xzf dist/mdrun-*.tar.gz -C target/package-smoke
          binary="$PWD/target/package-smoke/mdrun-v$(python3 packaging/distribution.py version)-${{ matrix.target }}/mdrun"
          test "$(env -i "$binary" --version)" = "mdrun $(python3 packaging/distribution.py version)"
          env -i "$binary" --help
          sh packaging/smoke.sh "$binary"
          echo "BINARY=$binary" >> "$GITHUB_ENV"
      - name: Require static Linux linkage
        if: runner.os == 'Linux'
        run: file "$BINARY" | grep -E 'statically linked|static-pie linked'
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - name: Build and install Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" --output dist/
          cargo generate-rpm --target "${{ matrix.target }}" --output dist/
          sh packaging/linux/verify-packages.sh "$PWD/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Generate checksums and Homebrew formula
        run: |
          (cd dist && sha256sum mdrun-*.tar.gz mdrun*.deb mdrun*.rpm > SHA256SUMS)
          python3 packaging/distribution.py formula "$(python3 packaging/distribution.py version)" dist/SHA256SUMS > dist/mdrun.rb
          ruby -c dist/mdrun.rb
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Publish verified assets
        working-directory: dist
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes mdrun-*.tar.gz mdrun*.deb mdrun*.rpm SHA256SUMS mdrun.rb
        env:
          GH_TOKEN: ${{ github.token }}
