name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/qualification.yml
      - sdk/**
      - scripts/prepare_sdk.py
      - scripts/prepare_jvm.py
      - packaging/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/qualification.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check locked crate notices
        run: python3 packaging/notices.py check
      - name: Check dependency quarantine before compilation
        run: python3 scripts/dependency_policy.py
      - name: Require the release tag to match the crate
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(python3 packaging/distribution.py version)"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target ${{ matrix.target }} && rustup default 1.98.1
      - name: Verify and preserve audited toolchain attribution
        run: python3 packaging/toolchain.py generate
      - name: Install the native musl C compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          musl-gcc --version
          dpkg-query -W musl-tools musl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - name: Build the macOS release
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build Linux with the audited Rust musl runtime
        if: runner.os == 'Linux'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo rustc --release --locked --target "${{ matrix.target }}" -- -C link-self-contained=yes -C "link-arg=-Wl,-Map=$RUNNER_TEMP/mdrun-link.map"
          python3 packaging/toolchain.py check-link --target "${{ matrix.target }}" --link-map "$RUNNER_TEMP/mdrun-link.map"
      - name: Package native archive
        run: python3 packaging/distribution.py archive "${{ matrix.target }}" dist
      - name: Record exact compiler and linked runtime inputs
        run: python3 packaging/toolchain.py record --target "${{ matrix.target }}" --source-revision "$GITHUB_SHA" --output "dist/mdrun-build-${{ matrix.target }}.json"
      - name: Verify archived standalone executable
        run: |
          mkdir target/package-smoke
          tar -xzf dist/mdrun-*.tar.gz -C target/package-smoke
          binary="$PWD/target/package-smoke/mdrun-v$(python3 packaging/distribution.py version)-${{ matrix.target }}/mdrun"
          test "$(env -i "$binary" --version)" = "mdrun $(python3 packaging/distribution.py version)"
          env -i "$binary" --help
          sh packaging/smoke.sh "$binary"
          echo "BINARY=$binary" >> "$GITHUB_ENV"
      - name: Require static Linux linkage
        if: runner.os == 'Linux'
        run: file "$BINARY" | grep -E 'statically linked|static-pie linked'
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - name: Build and install Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" --output dist/
          cargo generate-rpm --target "${{ matrix.target }}" --output dist/
          sh packaging/linux/verify-packages.sh "$PWD/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sdk:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/native-host
      - name: Extract the release host for SDK consumers
        run: |
          mkdir "$RUNNER_TEMP/sdk-host"
          tar -xzf "$RUNNER_TEMP/native-host/mdrun-v$(python3 packaging/distribution.py version)-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/sdk-host"
          echo "MDRUN_SDK_HOST=$RUNNER_TEMP/sdk-host/mdrun-v$(python3 packaging/distribution.py version)-x86_64-unknown-linux-musl/mdrun" >> "$GITHUB_ENV"
      - name: Build versioned runtime SDK archives
        run: |
          python3 scripts/prepare_jvm.py --java-home "$JAVA_HOME" --download --output "$RUNNER_TEMP/jvm-sdk"
          python3 packaging/sdk.py archive jvm dist --jvm-prepared "$RUNNER_TEMP/jvm-sdk"
          python3 packaging/sdk.py archive node dist
          python3 packaging/sdk.py archive python dist
          python3 packaging/sdk.py wheel dist
          cp scripts/prepare_sdk.py dist/prepare_sdk.py
      - name: Qualify pinned SDK installation outside the checkout
        run: |
          python3 packaging/qualify_sdk.py --archives dist --version "$(python3 packaging/distribution.py version)" --java-home "$JAVA_HOME" --node "$(command -v node)" --python "$(command -v python3)" --mdrun "$MDRUN_SDK_HOST" --output "$RUNNER_TEMP/sdk-consumer"
      - name: Qualify uv wheel installation and refusal guards
        run: MDRUN_UV="$(command -v uv)" python3 -m unittest discover -s packaging -p 'test_python_wheel.py'
      - name: Qualify the uv-installed Python SDK with the release host
        run: |
          wheel="$PWD/dist/mdrun_sdk-$(python3 packaging/distribution.py version)-py3-none-any.whl"
          digest="$(sha256sum "$wheel" | cut -d' ' -f1)"
          python3 packaging/qualify_python_wheel.py --wheel "$wheel" --version "$(python3 packaging/distribution.py version)" --sha256 "$digest" --python "$(command -v python3)" --uv "$(command -v uv)" --mdrun "$MDRUN_SDK_HOST" --output "$RUNNER_TEMP/sdk-wheel-consumer"
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-assets
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-consumption
          path: |
            ${{ runner.temp }}/sdk-consumer
            ${{ runner.temp }}/sdk-wheel-consumer
          if-no-files-found: error

  assemble:
    needs: [build, sdk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdk-assets
          path: dist
      - name: Generate checksums and Homebrew formula
        run: |
          (cd dist && sha256sum mdrun-*.tar.gz mdrun_sdk-*.whl mdrun*.deb mdrun*.rpm mdrun-build-*.json prepare_sdk.py > SHA256SUMS)
          python3 packaging/distribution.py formula "$(python3 packaging/distribution.py version)" dist/SHA256SUMS > dist/mdrun.rb
          ruby -c dist/mdrun.rb
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: [assemble, qualification]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Publish verified assets
        working-directory: dist
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes mdrun-*.tar.gz mdrun_sdk-*.whl mdrun*.deb mdrun*.rpm mdrun-build-*.json prepare_sdk.py SHA256SUMS mdrun.rb
        env:
          GH_TOKEN: ${{ github.token }}
