name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check dependency quarantine before compilation
        run: python3 scripts/dependency_policy.py
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
      - name: Qualify the cooperative Node SDK
        timeout-minutes: 1
        run: node --test --test-timeout=10000 tests/runtime/node/worker.test.mjs
      - name: Qualify native sessions with Node
        timeout-minutes: 1
        run: |
          MDRUN_NODE="$(command -v node)" cargo test --locked --test integration session:: -- --ignored --skip session::jvm_
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare hash-locked JVM SDK and independent cold fixture
        timeout-minutes: 2
        run: python3 tests/runtime/jvm/prepare.py --java-home "$JAVA_HOME" --download --output "$RUNNER_TEMP/jvm-fixture"
      - name: Qualify the cooperative JVM SDK
        timeout-minutes: 1
        env:
          MDRUN_JVM_FIXTURE: ${{ runner.temp }}/jvm-fixture/fixture-manifest.json
        run: python3 tests/runtime/jvm/qualify.py
      - name: Qualify native sessions with the JVM
        timeout-minutes: 1
        env:
          MDRUN_JVM_FIXTURE: ${{ runner.temp }}/jvm-fixture/fixture-manifest.json
        run: cargo test --locked --test integration session::jvm_ -- --ignored
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: mdrun-${{ matrix.os }}
          path: target/release/mdrun
          retention-days: 7
      - run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/compatibility -p 'test_*.py'
      - run: MDRUN_JAVA_HOME="$JAVA_HOME" python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      - name: Check contributor entry point
        run: test -L AGENTS.md && test "$(readlink AGENTS.md)" = CLAUDE.md

  compatibility-oracle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Fetch pinned upstream oracle
        run: git clone --branch v0.6.1 --depth 1 https://github.com/simonw/showboat.git "$RUNNER_TEMP/showboat-source"
      - name: Build and identify oracle
        run: python3 tests/compatibility/prepare.py --source "$RUNNER_TEMP/showboat-source" --output "$RUNNER_TEMP/showboat-oracle"
      - name: Check differential fixture determinism
        run: python3 tests/compatibility/oracle.py --oracle "$RUNNER_TEMP/showboat-oracle/showboat" --candidate "$RUNNER_TEMP/showboat-oracle/showboat" --suite upstream --results "$RUNNER_TEMP/oracle-selfcheck"
      - uses: actions/download-artifact@v8
        with:
          name: mdrun-${{ matrix.os }}
          path: ${{ runner.temp }}/candidate
      - name: Qualify document behavior
        run: |
          chmod +x "$RUNNER_TEMP/candidate/mdrun"
          python3 tests/compatibility/oracle.py --oracle "$RUNNER_TEMP/showboat-oracle/showboat" --candidate "$RUNNER_TEMP/candidate/mdrun" --results "$RUNNER_TEMP/product-differential"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/oracle-selfcheck
            ${{ runner.temp }}/product-differential
          retention-days: 7
