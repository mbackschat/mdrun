version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: maven
    directory: /sdk/jvm
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
