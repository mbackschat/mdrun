[package]
name = "mdrun"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Create, run, and verify executable Markdown documents"
license = "MIT"
repository = "https://github.com/mbackschat/mdrun"
publish = false

[package.metadata.deb]
maintainer = "Martin Backschat <mbackschat@mail.de>"
section = "devel"
depends = []
license-file = ["LICENSE", "0"]
assets = [
    ["target/release/mdrun", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mdrun/", "644"],
    ["CHANGELOG.md", "usr/share/doc/mdrun/", "644"],
    ["LICENSE", "usr/share/doc/mdrun/", "644"],
    ["THIRD_PARTY_NOTICES.txt", "usr/share/doc/mdrun/", "644"],
    ["TOOLCHAIN_NOTICES.txt", "usr/share/doc/mdrun/", "644"],
    ["docs/man/*.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
auto-req = "no"
assets = [
    { source = "target/release/mdrun", dest = "/usr/bin/mdrun", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/mdrun/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/mdrun/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/mdrun/LICENSE", mode = "644" },
    { source = "THIRD_PARTY_NOTICES.txt", dest = "/usr/share/licenses/mdrun/THIRD_PARTY_NOTICES.txt", mode = "644" },
    { source = "TOOLCHAIN_NOTICES.txt", dest = "/usr/share/licenses/mdrun/TOOLCHAIN_NOTICES.txt", mode = "644" },
    { source = "docs/man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
]

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"

[dependencies]
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["formatting"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
clap_mangen = "=0.3.3"
